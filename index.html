<style>
:root{--bg:#EDF3F1;--sf:#fff;--ink:#10262B;--mut:#546C71;--ln:#D3E1DD;--h1:#0B4F53;--h2:#12756F;--gold:#F0B04A;--on:#fff;--sh:0 10px 30px rgba(11,79,83,.10);color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1416;--sf:#142226;--ink:#E7F1EE;--mut:#93ABAB;--ln:#243A3E;--h1:#0E3F43;--h2:#0D5E5C;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1416;--sf:#142226;--ink:#E7F1EE;--mut:#93ABAB;--ln:#243A3E;--h1:#0E3F43;--h2:#0D5E5C;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;line-height:1.6;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--h1),var(--h2));display:grid;place-items:center;color:var(--gold);font-size:26px;font-weight:700;box-shadow:var(--sh)}
.brand b{font-size:24px;line-height:1.1;display:block}
.brand small{color:var(--mut);font-size:12px}
.tools{display:flex;gap:8px}
.ib{min-width:44px;height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;font-weight:600;font-size:14px}
.hero{background:linear-gradient(150deg,var(--h1),var(--h2));color:#fff;border-radius:28px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(240,176,74,.14)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:16px;position:relative;z-index:1}
.tabs button{border:0;background:none;color:#fff;border-radius:12px;min-height:44px;font-weight:500;opacity:.85}
.tabs button[aria-selected=true]{background:#fff;color:var(--h1);font-weight:700;opacity:1}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px;position:relative;z-index:1}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
.nav button:disabled{opacity:.3;cursor:default}
.nav span{font-weight:500;text-align:center}
.total{text-align:center;position:relative;z-index:1;padding:6px 0 10px}
.total .n{font-size:clamp(34px,11vw,46px);font-weight:700;letter-spacing:-.5px;line-height:1.2;direction:ltr;display:inline-block}
.total .c{color:var(--gold);font-weight:600;margin-inline-start:6px}
.total .s{opacity:.8;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;position:relative;z-index:1;direction:ltr}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;opacity:.9}
.bar i{display:block;width:100%;max-width:34px;min-height:4px;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.35)}
.bar.on i{background:var(--gold)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:18px;margin-top:16px;box-shadow:var(--sh)}
h2{font-size:17px;margin:0 0 12px}
.cats{display:flex;gap:18px;align-items:center}
.cats svg{width:120px;height:120px;flex:none;transform:rotate(-90deg)}
.lg{flex:1;display:grid;gap:8px;min-width:0}
.lg div{display:flex;align-items:center;gap:8px;font-size:14px}
.lg em{width:12px;height:12px;border-radius:4px;flex:none}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{direction:ltr;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.empty big{display:block;font-size:38px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--mut)}
.amt{font-weight:700;direction:ltr;white-space:nowrap}
.del{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--mut);font-size:18px}
.del:hover{color:#D6453D}
.fab{position:fixed;inset-inline-end:max(16px,calc(50% - var(--w)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:60px;padding:0 24px;border-radius:30px;border:0;background:var(--gold);color:#3A2500;font-weight:700;font-size:17px;box-shadow:0 12px 28px rgba(240,176,74,.45);display:flex;align-items:center;gap:8px}
dialog{border:0;border-radius:28px;padding:0;width:min(520px,calc(100% - 24px));background:var(--sf);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,15,17,.6)}
dialog form{padding:22px;display:grid;gap:14px}
label{font-weight:500;font-size:14px;display:grid;gap:6px}
input[type=text],input[type=date],input[inputmode=decimal]{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);padding:0 14px;font-size:16px}
#amt{font-size:30px;font-weight:700;height:68px;text-align:center;direction:ltr}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips label{position:relative;text-align:center;font-size:12px;font-weight:400;gap:2px}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:block;padding:10px 2px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg)}
.chips span i{display:block;font-style:normal;font-size:22px}
.chips input:checked+span{border-color:var(--h2);background:color-mix(in srgb,var(--h2) 14%,var(--sf));font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--gold)}
.acts{display:flex;gap:10px}
.acts button{flex:1;height:52px;border-radius:16px;border:1.5px solid var(--ln);background:none;font-weight:600}
.acts .ok{background:var(--h2);border-color:var(--h2);color:#fff;flex:2}
.err{color:#D6453D;font-size:13px;min-height:18px;margin:0}
.toast{position:fixed;inset-inline:0;bottom:96px;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.pill{height:44px;padding:0 16px;border-radius:14px;border:1.5px solid var(--ln);background:none;font-weight:600;white-space:nowrap}
.track{height:12px;border-radius:8px;background:var(--bg);overflow:hidden;margin:12px 0 8px}
.track i{display:block;height:100%;border-radius:8px;transition:width .5s}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mut)}
.bl b{color:var(--ink);direction:ltr}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px}
html{--w:620px}
header{flex-wrap:nowrap}.brand{min-width:0;flex:1}.brand>div:last-child{min-width:0}.brand b{white-space:nowrap}.brand small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{flex:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl{flex-wrap:wrap}.nav span{padding:0 6px}
dialog{max-height:calc(100dvh - 24px);overflow:auto}
@media (min-width:900px){html{--w:1040px}.wrap{max-width:1040px}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}main>.card{margin-top:0}main>section:nth-of-type(1){grid-column:1;grid-row:1}main>section:nth-of-type(2){grid-column:1;grid-row:2}main>section:nth-of-type(3){grid-column:1;grid-row:3}main>section:nth-of-type(4){grid-column:2;grid-row:1/span 3}}
@media (max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:28px 28px 0 0}dialog form{padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}}
@media (max-width:380px){.brand small{display:none}.ib{min-width:40px;height:40px;padding:0 8px}.hero{padding:14px;border-radius:24px}.card{padding:14px;border-radius:20px}.tabs button{font-size:13px}.cats{flex-direction:column;align-items:stretch}.cats svg{align-self:center}.chips{gap:6px}.chips label{font-size:11px}.fab{height:56px;padding:0 18px;font-size:16px}}
#tour{padding:0}
.tv{background:linear-gradient(150deg,var(--h1),var(--h2));color:#fff;min-height:250px;display:grid;place-items:center;padding:24px 18px;margin-top:12px}
.stage{width:100%;max-width:300px;text-align:center}
.tp{display:flex;gap:4px;padding:16px 16px 0}
.tp i{flex:1;height:4px;border-radius:4px;background:var(--ln);overflow:hidden}
.tp i b{display:block;height:100%;width:0;background:var(--gold)}
.tp i.done b{width:100%}
.tp i.cur b{animation:fill 5s linear forwards}
.tc{padding:16px 22px 6px;text-align:center;min-height:92px}
.tc h3{margin:0 0 4px;font-size:20px}.tc p{margin:0;color:var(--mut)}
.tn{display:flex;gap:8px;padding:12px 16px 18px}
.tn button{height:48px;border-radius:14px;border:1.5px solid var(--ln);background:none;font-weight:600;padding:0 14px}
.tn .ok{flex:1;background:var(--h2);border-color:var(--h2);color:#fff}
.tn button:disabled{opacity:.35}
.pop{animation:pop .6s both}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes grow{from{height:4px}}
@keyframes fill{to{width:100%}}
@keyframes bud{0%{width:5%;background:#12A08F}55%{width:80%;background:#F0B04A}100%{width:100%;background:#D6453D}}
#tour.pz *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.pop,.bar i,.stage .track i{animation:none!important}.tp i.cur b{animation:none;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">ق</div><div><b id="nm"></b><small id="tg"></small></div></div>
    <div class="tools">
      <button class="ib" id="install" hidden aria-label="تثبيت التطبيق">⬇️</button>

      <button class="ib" id="lang"></button>
      <button class="ib" id="theme" aria-label=""></button>

  <main>
    <section class="hero" aria-live="polite">

      <div class="total"><span class="n" id="tot"></span><span class="c" id="cur"></span><div class="s" id="cnt"></div></div>

    <section class="card" id="bud"></section>
    <section class="card"><h2 id="h-cat"></h2><div id="cats"></div></section>
    <section class="card"><div class="bh" style="margin-bottom:6px"><h2 id="h-list" style="margin:0"></h2><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="pill" id="backup"></button><button class="pill" id="restore"></button><button class="pill" id="xl"></button></div></div><input id="restore-file" type="file" accept="application/json,.json" hidden><div id="list"></div></section>
  </main>
</div>
<button class="fab" id="add"><span aria-hidden="true">＋</span><span id="addt"></span></button>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg" aria-labelledby="dt">
  <form id="frm" method="dialog">
    <h2 id="dt" style="font-size:20px;margin:0"></h2>
    <label><span id="l-amt"></span><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0.000"></label>
    <div><div style="font-weight:500;font-size:14px;margin-bottom:6px" id="l-cat"></div><div class="chips" id="chips"></div></div>
    <label><span id="l-note"></span><input type="text" id="note" maxlength="60"></label>
    <label><span id="l-date"></span><input type="date" id="date"></label>
    <label style="display:flex;align-items:center;gap:10px;font-weight:400"><input type="checkbox" id="rep" style="width:22px;height:22px;accent-color:var(--h2)"><span id="l-rep"></span></label>
    <p class="err" id="err" role="alert"></p>
    <div class="acts"><button type="button" id="cancel"></button><button type="submit" class="ok" id="save"></button></div>
  </form>
</dialog>

<dialog id="bdlg" aria-labelledby="bdt">
  <form id="bfrm" method="dialog">
    <h2 id="bdt" style="font-size:20px;margin:0"></h2>
    <label><span id="bl-amt"></span><input id="bamt" inputmode="decimal" autocomplete="off" placeholder="0.000" style="font-size:30px;font-weight:700;height:68px;text-align:center;direction:ltr"></label>
    <div class="acts"><button type="button" id="bcancel"></button><button type="submit" class="ok" id="bsave"></button></div>
  </form>
</dialog>

<dialog id="tour" aria-labelledby="tt">
  <div class="tp" id="tp"></div>
  <div class="tv"><div class="stage" id="tv" aria-hidden="true"></div></div>
  <div class="tc" id="tc" aria-live="polite"></div>
  <div class="tn"><button id="tprev"></button><button class="ok" id="tnext" autofocus></button><button id="tpz" aria-pressed="false">⏸</button><button id="tskip"></button></div>
</dialog>

function applyRec(){var now=new Date(),td=iso(now),cm=now.getFullYear()*12+now.getMonth(),k=0,ch=false;
 S.rec.forEach(function(r){var p=r.last.split('-'),m=(+p[0])*12+(+p[1]);
  while(m<=cm){var y=Math.floor(m/12),mo=m%12,dd=Math.min(r.day,new Date(y,mo+1,0).getDate()),ds=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
   if(ds>td)break;S.items.push({id:Date.now()+1000+(k++),amt:r.amt,cat:r.cat,note:r.note,date:ds});r.last=ds.slice(0,7);m++;ch=true}});
 if(ch){sv('qaid.items',S.items);sv('qaid.rec',S.rec)}}

 if(!b){$('bud').innerHTML='<div class="bh"><div class="ic" style="background:#F0B04A26" aria-hidden="true">🎯</div><div class="rt"><b>'+L.bt+'</b><small>'+L.bhint+'</small></div><button class="pill" data-b>'+L.bset+'</button></div>';return}

function downloadFile(filename, data, type){
 var blob=new Blob([data],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

$('restore').onclick=function(){$('restore-file').click()};
$('restore-file').addEventListener('change',function(){
 var f=this.files&&this.files[0];if(!f)return;
 var reader=new FileReader();
 reader.onload=function(){
  try{
   var p=JSON.parse(reader.result);
   if(!p||p.app!=='Qaid'||!Array.isArray(p.items)||!Array.isArray(p.rec)||typeof p.budget!=='number')throw new Error('bad');
   if(!p.items.every(function(x){return x&&typeof x.id==='number'&&typeof x.amt==='number'&&typeof x.cat==='string'&&typeof x.date==='string'}))throw new Error('bad');
   S.items=p.items;S.rec=p.rec;S.budget=p.budget;
   if(p.lang==='ar'||p.lang==='en')S.lang=p.lang;
   if(p.theme==='light'||p.theme==='dark'||p.theme==='')S.theme=p.theme;
   sv('qaid.items',S.items);sv('qaid.rec',S.rec);sv('qaid.budget',S.budget);sv('qaid.lang',S.lang);sv('qaid.theme',S.theme);
   applyTheme();render();buildChips();toast(t().restoreok);
  }catch(e){toast(t().restorebad)}
  $('restore-file').value='';
 };
 reader.readAsText(f);
});

];
